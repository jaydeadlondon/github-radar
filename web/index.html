<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Radar — rising stars tracker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg
          class="logo"
          viewBox="0 0 24 24"
          width="28"
          height="28"
          aria-hidden="true"
        >
          <circle
            cx="12"
            cy="12"
            r="10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <circle
            cx="12"
            cy="12"
            r="5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <circle cx="12" cy="3" r="2" fill="currentColor" />
          <circle cx="19" cy="15" r="2" fill="currentColor" />
        </svg>
        <h1>GitHub Radar</h1>
      </div>
      <div class="topbar-actions">
        <button
          id="theme-toggle"
          class="icon-btn"
          title="Toggle theme"
          aria-label="Toggle theme"
        >
          🌙
        </button>
        <span class="status-badge" id="status-badge">loading…</span>
      </div>
    </header>

    <main class="content">
      <section class="filters card">
        <input
          id="search"
          type="search"
          placeholder="Search repositories…"
          autocomplete="off"
        />
        <select id="language-filter" aria-label="Filter by language">
          <option value="">All languages</option>
        </select>
        <button id="refresh-btn" class="btn">Refresh</button>
      </section>

      <section class="grid">
        <div class="card">
          <h2>Tracked repositories</h2>
          <div class="table-wrap" id="repos-table-wrap">
            <div class="empty">Loading…</div>
          </div>
        </div>

        <div class="card chart-panel">
          <div class="chart-title">Star growth</div>
          <div class="chart-sub" id="chart-sub">
            Select a repository to see its history
          </div>
          <div id="chart"></div>
        </div>

        <section class="card full" id="risers-section">
          <h2>New this week</h2>
          <div class="riser-grid" id="riser-grid">
            <div class="empty">Loading…</div>
          </div>
        </section>
      </section>
    </main>

    <div id="toasts"></div>

    <script src="/vendor/echarts.min.js"></script>
    <script src="/charts.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
