<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Radar</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg
          class="logo"
          viewBox="0 0 24 24"
          width="28"
          height="28"
          aria-hidden="true"
        >
          <circle
            cx="12"
            cy="12"
            r="10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <circle
            cx="12"
            cy="12"
            r="5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <circle cx="12" cy="3" r="2" fill="currentColor" />
          <circle cx="19" cy="15" r="2" fill="currentColor" />
        </svg>
        <h1>GitHub Radar</h1>
      </div>
      <span class="status-badge" id="status-badge">loading…</span>
    </header>

    <main class="content">
      <section class="placeholder">
        <h2>Dashboard is being built</h2>
        <p>Version 0.4 is in progress — the first dashboard views land here.</p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
